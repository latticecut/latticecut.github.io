# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'jekyll serve'. If you change this file, please restart the server process.

# Site settings
title:
  en: SuperLattice 非常格子
  zh: SuperLattice 非常格子
email: a.p.moore@ucl.ac.uk
description:
# Write an awesome description for your new site here. You can edit this line in _config.yml. It will appear in your document head meta (for Google search results) and in your feed.xml site description.
  en: Collected writings to help me crystallise my thoughts and ideas, hopefully moving them from a disordered state to a slightly more ordered one.
  zh: 收集的著作帮助我明确自己的思想和观念，希望把它们从无序状态带到稍微更有序的状态。
home_intro:
  en:
    title: Writing at the intersection of AI, science and strategy.
    body: Essays on machine intelligence, technological change and the organisational questions that emerge when capability shifts.
    list_heading: Latest Essays
    reading_label: min read
    date_format: "%b %-d, %Y"
  zh:
    title: 写作聚焦于 AI、科学与战略的交汇处。
    body: 这个网站汇集了关于机器智能、技术变迁，以及当能力边界发生变化时随之出现的组织问题的文章。
    list_heading: 最新文章
    reading_label: 分钟阅读
    date_format: "%Y年%-m月%-d日"
index:
  en:
  zh: 索引.html
feed:
  en: /feed.xml
  zh: /馈送.xml
baseurl: # the subpath of your site, e.g. /blog
url: "https://www.amaams.co.uk" # the base hostname & protocol for your site
timezone: Europe/London
twitter_username: latticecut
github_username:  latticecut

# Build settings
markdown: kramdown

# Mini dashboards and interactive media. Each file in `_projects` becomes a
# self-contained microsite at `/projects/<filename>/`.
collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: project
      lang: en

# Standalone applications keep their own build systems and are linked from the
# collection rather than being processed as Jekyll content.
exclude:
  - _projects/ai-mathematical-proof-analysis-jekyll
  - scripts
  - tmp
