<html lang="en-GB">

    <script type="module" crossorigin src="./assets/index-8eaa617c.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DgmCWThy.css">
    <style>
      .usageNote { display: none; }
      .runEntry {
        display: block;
        position: relative;
        padding: 16px 32px 16px 0;
        cursor: pointer;
      }
      .runEntry::after {
        content: "+";
        position: absolute;
        top: 16px;
        right: 6px;
        color: var(--blue);
        font-size: 20px;
        line-height: 1;
      }
      .runEntry.is-open::after { content: "−"; }
      .runEntry:focus-visible {
        outline: 2px solid var(--blue);
        outline-offset: 4px;
      }
      .runDate {
        flex-direction: row;
        align-items: baseline;
        flex-wrap: wrap;
        gap: 4px 12px;
      }
      .runDetails {
        display: none;
        margin-top: 14px;
      }
      .runEntry.is-open .runDetails { display: block; }
      .evidenceSection .tableWrap {
        max-height: min(65vh, 620px);
        overflow-x: auto;
        overflow-y: scroll;
        scrollbar-gutter: stable;
        scrollbar-color: #a8a8a8 var(--soft);
        scrollbar-width: auto;
        border-bottom: 1px solid var(--line);
      }
      .evidenceSection .tableWrap::-webkit-scrollbar {
        width: 12px;
        height: 12px;
      }
      .evidenceSection .tableWrap::-webkit-scrollbar-track {
        background: var(--soft);
        border-left: 1px solid var(--line);
      }
      .evidenceSection .tableWrap::-webkit-scrollbar-thumb {
        min-height: 48px;
        border: 3px solid var(--soft);
        border-radius: 8px;
        background: #a8a8a8;
      }
      .evidenceSection th {
        position: sticky;
        top: 0;
        z-index: 1;
        background: var(--paper);
      }
      .dashboard {
        display: flex;
        flex-direction: column;
      }
      .dashboard > .sectionHeading { display: none; }
      .dashboard > .chartCard { order: 1; }
      .dashboard > .filterPanel {
        order: 3;
        margin-top: 0;
      }
      .dashboard > .metricGrid {
        order: 2;
        margin: 16px 0;
      }
      .dashboard {
        padding-top: 28px;
        padding-bottom: 30px;
      }
      .dashboard > .filterPanel { padding: 14px 0; }
      .evidenceSection {
        padding-top: 30px;
        padding-bottom: 36px;
      }
      .rawDataSection {
        max-width: 800px;
        margin: 0 auto;
        padding: 36px 30px 42px;
        border-top: 1px solid var(--line);
      }
      .rawDataGrid {
        display: grid;
        grid-template-columns: 1fr;
        border-top: 1px solid var(--line);
      }
      .rawDataBundle {
        display: inline-block;
        margin: -8px 0 20px;
        padding: 9px 13px;
        border: 1px solid #b9d2f2;
        border-radius: 3px;
        background: #f3f7fc;
        font-size: 14px;
      }
      .rawDataItem {
        display: grid;
        grid-template-columns: minmax(0, 1fr) max-content;
        align-items: baseline;
        gap: 20px;
        min-width: 0;
        padding: 12px 0;
        border-bottom: 1px solid var(--line);
      }
      .rawDataItem:nth-child(odd),
      .rawDataItem:nth-child(even) { padding-left: 0; padding-right: 0; }
      .rawDataItem a { font-size: 15px; }
      .rawDataItem p {
        display: none;
      }
      .rawDataItem code {
        color: var(--muted);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        overflow-wrap: anywhere;
      }
      .chartCard .segmented { display: none; }
      .legend {
        gap: 8px;
        flex-wrap: wrap;
      }
      .legend button {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        border: 1px solid transparent;
        border-radius: 3px;
        background: transparent;
        color: #666;
        padding: 5px 8px;
        cursor: pointer;
      }
      .legend button:hover { background: var(--soft); }
      .legend button[aria-pressed="true"] {
        border-color: #b9d2f2;
        background: #f3f7fc;
        color: var(--ink);
      }
      .legend button:focus-visible {
        outline: 2px solid var(--blue);
        outline-offset: 2px;
      }
      .legend button .dot { margin-left: 0; }
      @media (min-width: 801px) {
        .metricGrid { grid-template-columns: repeat(6, minmax(0, 1fr)); }
        .metricGrid article { padding: 14px; }
        .metricGrid strong { font-size: 28px; }
      }
      @media (max-width: 800px) {
        .metricGrid article {
          min-height: 108px;
          padding: 14px 18px;
        }
      }
      @media (max-width: 600px) {
        .topbar {
          align-items: flex-start;
          flex-direction: column;
          min-height: 104px;
          padding-bottom: 13px;
        }
        .brand {
          line-height: 56px;
          white-space: nowrap;
        }
        .topbar nav {
          gap: 20px;
          width: 100%;
        }
        body::before { top: 108px; }
        .dashboard { padding-top: 22px; padding-bottom: 24px; }
        .dashboard > .metricGrid { margin: 12px 0; }
        .dashboard > .filterPanel { padding: 12px 0; }
        .evidenceSection { padding-top: 24px; padding-bottom: 30px; }
        .rawDataSection { padding: 30px 20px 34px; }
        .rawDataGrid { grid-template-columns: 1fr; }
        .rawDataItem,
        .rawDataItem:nth-child(odd),
        .rawDataItem:nth-child(even) {
          grid-template-columns: 1fr;
          gap: 4px;
          padding: 15px 0;
          border-right: 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.addEventListener("DOMContentLoaded", function () {
        function enhanceNavigation() {
          var nav = document.querySelector(".topbar nav");
          if (nav && !nav.querySelector('[href="/projects/"]')) {
            var projectsLink = document.createElement("a");
            projectsLink.href = "/projects/";
            projectsLink.textContent = "Projects";
            nav.insertBefore(projectsLink, nav.firstChild);
          }
          if (nav && !nav.querySelector('[href="/"]')) {
            var articlesLink = document.createElement("a");
            articlesLink.href = "/";
            articlesLink.textContent = "Articles";
            nav.insertBefore(articlesLink, nav.firstChild);
          }
        }

        enhanceNavigation();

        function enhanceLogEntries() {
          document.querySelectorAll(".runEntry:not([data-disclosure])").forEach(function (entry) {
            entry.dataset.disclosure = "true";
            entry.tabIndex = 0;
            entry.setAttribute("role", "button");
            entry.setAttribute("aria-expanded", "false");

            function toggleEntry() {
              var isOpen = entry.classList.toggle("is-open");
              entry.setAttribute("aria-expanded", String(isOpen));
            }

            entry.addEventListener("click", function (event) {
              if (event.target.closest("a, button")) return;
              toggleEntry();
            });
            entry.addEventListener("keydown", function (event) {
              if (event.key === "Enter" || event.key === " ") {
                event.preventDefault();
                toggleEntry();
              }
            });
          });
        }

        var selectedCategories = new Set(["Expected", "Difficult", "Superhuman"]);

        function syncLegendSelection() {
          document.querySelectorAll(".legend button[data-category]").forEach(function (button) {
            button.setAttribute("aria-pressed", String(selectedCategories.has(button.dataset.category)));
          });
        }

        function updateChartSeries() {
          var columns = Array.from(document.querySelectorAll(".barColumn"));
          var rows = columns.map(function (column) {
            var match = (column.title || "").match(/:\s*(\d+) expected,\s*(\d+) difficult,\s*(\d+) superhuman/i);
            if (!match) return null;
            var counts = {
              Expected: Number(match[1]),
              Difficult: Number(match[2]),
              Superhuman: Number(match[3])
            };
            var total = Array.from(selectedCategories).reduce(function (sum, category) {
              return sum + counts[category];
            }, 0);
            return { column: column, counts: counts, total: total };
          }).filter(Boolean);

          var maximum = Math.max(1, ...rows.map(function (row) { return row.total; }));
          rows.forEach(function (row) {
            var stack = row.column.querySelector(".barStack");
            var value = row.column.querySelector(".barValue");
            if (value && value.textContent !== String(row.total)) {
              value.textContent = row.total;
            }
            if (stack) stack.style.height = (row.total / maximum * 100) + "%";

            [
              ["Expected", ".barExpected"],
              ["Difficult", ".barDifficult"],
              ["Superhuman", ".barSuperhuman"]
            ].forEach(function (item) {
              var segment = row.column.querySelector(item[1]);
              if (!segment) return;
              var visible = selectedCategories.has(item[0]);
              segment.style.display = visible ? "block" : "none";
              segment.style.height = visible && row.total ? (row.counts[item[0]] / row.total * 100) + "%" : "0%";
            });
          });
        }

        function enhanceChartLegend() {
          var legend = document.querySelector(".legend:not([data-selectable])");
          if (!legend) return;

          legend.dataset.selectable = "true";
          legend.setAttribute("aria-label", "Filter chart by challenge category");
          legend.replaceChildren();

          [
            ["Expected", "expected"],
            ["Difficult", "difficult"],
            ["Superhuman", "superhuman"]
          ].forEach(function (item) {
            var button = document.createElement("button");
            button.type = "button";
            button.dataset.category = item[0];
            button.setAttribute("aria-pressed", "true");

            var dot = document.createElement("span");
            dot.className = "dot " + item[1];
            dot.setAttribute("aria-hidden", "true");
            button.append(dot, document.createTextNode(item[0]));

            button.addEventListener("click", function () {
              if (selectedCategories.has(item[0])) {
                if (selectedCategories.size === 1) return;
                selectedCategories.delete(item[0]);
              } else {
                selectedCategories.add(item[0]);
              }
              syncLegendSelection();
              updateChartSeries();
            });
            legend.appendChild(button);
          });
          syncLegendSelection();
        }

        function enhanceRawData() {
          if (document.querySelector(".rawDataSection")) return;
          var logSection = document.querySelector(".logSection");
          if (!logSection) return;

          var files = [
            ["Audited evidence ledger", "difficulty_scored_entries.csv", "The complete entry-level dataset, including claims, scores, classifications and scoring rationales."],
            ["Monthly challenge breakdown", "difficulty_monthly_breakdown.csv", "Monthly totals split across Expected, Difficult and Superhuman classifications."],
            ["Take-off timeline counts", "takeoff_counts_jan2025.csv", "Monthly and cumulative audited-entry counts from January 2025."],
            ["Scoring methodology", "difficulty_method.txt", "The definitions and rules used to calculate the hybrid challenge score."],
            ["Reference map", "reference-map.json", "Source titles and URLs linked to each audited evidence entry."],
            ["Analysis run history", "analysis-log.json", "Collection dates, model provenance and material changes for each analysis run."]
          ];

          var section = document.createElement("section");
          section.className = "rawDataSection";
          section.id = "raw-data";

          var heading = document.createElement("div");
          heading.className = "sectionHeading";
          heading.innerHTML = '<div><span class="sectionNumber">04</span><h2>Raw Data</h2></div><p>Download the complete source files used to build this dashboard and reproduce the analysis.</p>';

          var grid = document.createElement("div");
          grid.className = "rawDataGrid";
          files.forEach(function (file) {
            var item = document.createElement("article");
            item.className = "rawDataItem";

            var link = document.createElement("a");
            link.href = "./data/" + file[1];
            link.download = file[1];
            link.textContent = file[0] + " ↓";

            var description = document.createElement("p");
            description.textContent = file[2];
            var filename = document.createElement("code");
            filename.textContent = file[1];
            item.append(link, description, filename);
            grid.appendChild(item);
          });

          var bundle = document.createElement("a");
          bundle.className = "rawDataBundle";
          bundle.href = "./data/ai-mathematical-proof-raw-data.zip";
          bundle.download = "ai-mathematical-proof-raw-data.zip";
          bundle.textContent = "Download all raw data (.zip) ↓";

          section.append(heading, bundle, grid);
          logSection.before(section);

          var logNumber = logSection.querySelector(".sectionNumber");
          if (logNumber) logNumber.textContent = "05";
        }

        function enhanceProject() {
          enhanceNavigation();
          enhanceLogEntries();
          enhanceChartLegend();
          enhanceRawData();
          updateChartSeries();
        }

        ["input", "change"].forEach(function (eventName) {
          document.addEventListener(eventName, function (event) {
            if (event.target.closest(".filterPanel")) {
              window.setTimeout(updateChartSeries, 0);
            }
          });
        });

        enhanceProject();
        new MutationObserver(enhanceProject).observe(document.getElementById("root"), {
          childList: true,
          subtree: true
        });
      });
    </script>
  </body>
</html>
